[project]
name = "aeon-play"
version = "1.0.0"
description = "Interactive Time Series Machine Learning Playground powered by aeon"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "aeon-play contributors" }
]
keywords = ["time-series", "machine-learning", "dashboard", "aeon", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "dash[diskcache]>=2.14.0",
    "dash-bootstrap-components>=1.5.0",
    "psutil>=5.9.0",
    "dash-extensions>=1.0.0",
    "plotly>=5.18.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "aeon>=0.8.0",
    "diskcache>=5.6.0",
    "flask-caching>=2.1.0",
    "gunicorn>=21.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
all = [
    "aeon[all_extras]>=0.8.0",
]

[project.urls]
Homepage = "https://aeon-play.org"
Repository = "https://github.com/aeon-toolkit/aeon-play"
Documentation = "https://aeon-play.org/docs"

[project.scripts]
aeon-play = "aeon_play.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeon_play"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
