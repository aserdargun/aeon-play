# Production Docker Compose override
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.8'

services:
  aeon-play:
    image: aeon-play:latest
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    environment:
      - AEON_PLAY_DEBUG=false
      - AEON_PLAY_MAX_CASES=5000
      - AEON_PLAY_MAX_TIMEPOINTS=2000

  nginx:
    image: nginx:alpine
    container_name: aeon-play-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # Mount SSL certificates
    depends_on:
      - aeon-play
    restart: unless-stopped
